apiVersion: apps/v1
kind: Deployment

metadata:
  name: spring-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: spring-app

  template:
    metadata:
      labels:
        app: spring-app

    spec:
      containers:
      - name: spring-app

        image: spring3hibernate:v2

        imagePullPolicy: Never

        ports:
        - containerPort: 8080
